version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "Europe/Oslo"
    groups:
      gradle-wrapper:
        patterns:
          - "gradle-wrapper"
      dependency-updates:
        patterns:
          - "*"
        exclude-patterns:
          - "gradle-wrapper"
